name: Feature request
description: Propose something the SDK doesn't do yet.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem motivates this?
      description: What are you trying to do, and how does the SDK's current surface get in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like the SDK to do instead, ideally with a sketch of the API shape.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've considered solving this — including workarounds you're using today.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else worth knowing.
    validations:
      required: false
